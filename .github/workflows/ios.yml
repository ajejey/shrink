# iOS builds on GitHub's Macs, so the app never needs a Mac of our own. Shrink is native SwiftUI,
# and XcodeGen makes the Xcode project from ios/project.yml.
#
# test        every push that touches the app, and every TestFlight tag: generates the project, runs the
#             encoding tests on an iPhone simulator, opens the app and saves screenshots
#             (Actions run > Artifacts > ios-results).
# freeup-on-photos  every push too: Free up space start to finish on a simulator's real Photos library,
#             shrinking videos and then cleaning up photos (Actions run > Artifacts > freeup-e2e, cleanup-e2e).
# testflight  a pushed tag named ios-* (or "Run workflow" with TestFlight ticked): signs the app and
#             uploads it to TestFlight. Needs the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets (an
#             App Store Connect Team key with Admin access) and IOS_DIST_KEY, all of which
#             `node scripts/ios-signing.mjs setup` puts there. The app and its share sheet each have an
#             App Store profile; both carry the App Group they share settings through.
name: iOS

on:
  push:
    branches: [main]
    paths:
      - 'ios/**'
      - 'shared/**'
      - 'scripts/ios-signing.mjs'
      - 'scripts/check-freeup-e2e.mjs'
      - 'scripts/check-cleanup-e2e.mjs'
      - '.github/workflows/ios.yml'
    tags: ['ios-*']
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload this build to TestFlight
        type: boolean
        default: false

# A newer push to main replaces an older build still running. TestFlight tags are never cancelled.
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  test:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Pick an iPhone simulator
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            const all = Object.values(JSON.parse(require("fs").readFileSync(0, "utf8")).devices).flat()
            const phones = all.filter(d => /^iPhone \d+ Pro$/.test(d.name)).sort((a, b) => b.name.localeCompare(a.name, "en", { numeric: true }))
            console.log((phones[0] || all.find(d => d.name.startsWith("iPhone"))).udid)')
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"

      - name: Run the encoding tests
        run: |
          set -o pipefail
          mkdir -p results
          xcodebuild -version
          xcodebuild test -project ios/Shrink.xcodeproj -scheme Shrink \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -resultBundlePath results/tests.xcresult CODE_SIGNING_ALLOWED=NO             -test-timeouts-enabled YES -default-test-execution-time-allowance 420 \
            | tee results/test-log.txt | grep -E "error:|warning: .*Shrink|Test Case .*(passed|failed|skipped)|PHOTO-LOOK|Executed|TEST (SUCCEEDED|FAILED)|BUILD (SUCCEEDED|FAILED)"

      - name: Open the app and take screenshots
        if: always()
        run: |
          DEVICE=${{ steps.sim.outputs.udid }}
          APP=build/Build/Products/Debug-iphonesimulator/Shrink.app
          [ -d "$APP" ] || { echo "No app was built"; exit 0; }
          xcrun simctl boot "$DEVICE" || true
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl install "$DEVICE" "$APP"
          xcrun simctl launch "$DEVICE" com.useshrink.app
          sleep 5 && xcrun simctl io "$DEVICE" screenshot results/1-home.png
          # Each screen of a job, frozen by the app's -screenshot argument. The trim screen opens a
          # sample video copied into the app's own tmp folder.
          cp ios/ScreenshotMedia/sample-video.mp4 "$(xcrun simctl get_app_container "$DEVICE" com.useshrink.app data)/tmp/"
          n=2
          for state in trim shrinking done failed report report-sent places settings freeup-home freeup-intro freeup-pick freeup-check freeup-working freeup-paused freeup-done freeup-kept freeup-full freeup-over cleanup-intro cleanup-piles cleanup-looking cleanup-screenshots cleanup-similar cleanup-live cleanup-swipe cleanup-check cleanup-working cleanup-done cleanup-declined quick-frame quick-gif quick-working quick-gif-done quick-frame-done quick-sound-done quick-mute-done quick-mute-saved quick-failed pro pro-several options options-free batch-check batch-each batch-toomuch batch-working batch-done; do
            xcrun simctl terminate "$DEVICE" com.useshrink.app || true
            xcrun simctl launch "$DEVICE" com.useshrink.app -screenshot "$state"
            # batch-done really shrinks two 40 s videos on the simulator's software encoder.
            case "$state" in batch-done) wait=150 ;; *) wait=6 ;; esac
            sleep "$wait" && xcrun simctl io "$DEVICE" screenshot "results/$n-$state.png"
            n=$((n + 1))
          done
          # The home screen, to see the app icon.
          xcrun simctl terminate "$DEVICE" com.useshrink.app || true
          sleep 1 && xcrun simctl io "$DEVICE" screenshot results/$n-icon-on-home-screen.png
          xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "Shrink"' --style compact > results/app-log.txt || true
          xcrun simctl shutdown "$DEVICE" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-results
          path: results/

  # Free up space from start to finish on a simulator with a real Photos library. Three videos (HDR,
  # one with a place that the test makes a favorite in an album, one stored sideways like an iPhone's
  # portrait video) go through the app's own screens and iOS's delete prompt, with a trip out of the
  # app partway; then scripts/check-freeup-e2e.mjs checks every copy against its original.
  # Screenshots, the library before and after, and the app's log: Artifacts > freeup-e2e.
  freeup-on-photos:
    runs-on: macos-26
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: brew install xcodegen ffmpeg

      - name: Generate the Xcode project
        run: cd ios && xcodegen generate

      # 10 seconds each at about 80 Mbps (around 100 MB, like 4K iPhone footage), with noise so they
      # can't be squeezed small, so each is worth shrinking.
      - name: Make the test videos
        run: |
          mkdir -p media e2e
          SOURCE="testsrc2=s=1920x1080:r=30,noise=alls=30:allf=t"
          CBR="-b:v 80M -minrate 80M -maxrate 80M -bufsize 80M -x264-params nal-hrd=cbr"
          # HDR: HEVC 10-bit HLG at 2560x1440 with sound, like an iPhone's HDR video.
          ffmpeg -hide_banner -loglevel error -f lavfi -i "testsrc2=s=2560x1440:r=30,noise=alls=30:allf=t" \
            -f lavfi -i "sine=frequency=330:sample_rate=48000" -t 10 \
            -c:v libx265 -preset ultrafast -pix_fmt yuv420p10le -tag:v hvc1 -b:v 80M -maxrate 80M -bufsize 80M \
            -x265-params "colorprim=bt2020:transfer=arib-std-b67:colormatrix=bt2020nc:log-level=error" \
            -color_primaries bt2020 -color_trc arib-std-b67 -colorspace bt2020nc \
            -c:a aac -b:a 192k media/hdr.mov
          # 1080p H.264 with sound and a place.
          ffmpeg -hide_banner -loglevel error -f lavfi -i "$SOURCE" \
            -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 10 \
            -c:v libx264 -preset ultrafast $CBR -pix_fmt yuv420p -c:a aac -b:a 192k \
            -movflags use_metadata_tags -metadata "com.apple.quicktime.location.ISO6709=+48.8584+002.2945+035.000/" \
            media/place.mov
          # Portrait: stored sideways with a 90° turn, like an iPhone's. Silent.
          ffmpeg -hide_banner -loglevel error -f lavfi -i "$SOURCE" -t 10 \
            -c:v libx264 -preset ultrafast $CBR -pix_fmt yuv420p media/sideways.mov
          ffmpeg -hide_banner -loglevel error -display_rotation 90 -i media/sideways.mov -c copy media/portrait.mov \
            || ffmpeg -hide_banner -loglevel error -i media/sideways.mov -c copy -metadata:s:v:0 rotate=90 media/portrait.mov
          rm media/sideways.mov
          ls -la media
          for f in media/*.mov; do
            echo "$f"; ffprobe -hide_banner -loglevel error -of compact \
              -show_entries stream=codec_name,width,height,pix_fmt,color_transfer:stream_side_data=rotation "$f"
          done

      - name: Pick and boot an iPhone simulator, add the videos to its Photos
        id: sim
        run: |
          DEVICE=$(xcrun simctl list devices available -j | node -e '
            const all = Object.values(JSON.parse(require("fs").readFileSync(0, "utf8")).devices).flat()
            const phones = all.filter(d => /^iPhone \d+ Pro$/.test(d.name)).sort((a, b) => b.name.localeCompare(a.name, "en", { numeric: true }))
            console.log((phones[0] || all.find(d => d.name.startsWith("iPhone"))).udid)')
          echo "udid=$DEVICE" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$DEVICE"
          xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl status_bar "$DEVICE" override --time 9:41 --batteryState charged --batteryLevel 100
          xcrun simctl addmedia "$DEVICE" media/*.mov
          # The test also taps iOS's own Photos prompt if this doesn't take.
          xcrun simctl privacy "$DEVICE" grant photos com.useshrink.app || true

      - name: Build the app and its UI tests
        run: |
          xcodebuild build-for-testing -project ios/Shrink.xcodeproj -scheme ShrinkDemo \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= -quiet

      - name: Free up space, start to finish
        run: |
          set -o pipefail
          TEST_RUNNER_E2E_SHOTS="$PWD/e2e" xcodebuild test-without-building -project ios/Shrink.xcodeproj \
            -scheme ShrinkDemo -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -only-testing:ShrinkUITests/FreeUpSpaceE2ETests -resultBundlePath e2e/e2e.xcresult \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee e2e/test-log.txt \
            | grep -E "E2E|Test Case|error:|TEST (EXECUTE )?(SUCCEEDED|FAILED)"

      - name: Check the library afterwards
        if: always()
        run: |
          DEVICE=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.useshrink.app data) || true
          cp "$DATA"/Documents/e2e-*.json e2e/ 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" log show --last 40m --predicate 'process == "Shrink"' --style compact > e2e/app-log.txt || true
          node scripts/check-freeup-e2e.mjs e2e

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: freeup-e2e
          path: e2e/

      # Then Clean up photos on the same library: the app's Debug hook adds a camera photo, a picture
      # from a chat, the same picture twice and a Live Photo (ios/Shrink/E2EPhotos.swift); the test
      # deletes the pre-picked duplicate and turns the Live Photo into a still through iOS's prompt;
      # scripts/check-cleanup-e2e.mjs checks that exactly that changed.
      - name: Clean up photos, start to finish
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          mkdir -p e2e-photos
          TEST_RUNNER_E2E_SHOTS="$PWD/e2e-photos" xcodebuild test-without-building -project ios/Shrink.xcodeproj             -scheme ShrinkDemo -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build             -only-testing:ShrinkUITests/PhotoCleanupE2ETests -resultBundlePath e2e-photos/e2e.xcresult             CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 | tee e2e-photos/test-log.txt             | grep -E "E2E|Test Case|error:|TEST (EXECUTE )?(SUCCEEDED|FAILED)"

      - name: Check the photo library afterwards
        if: ${{ !cancelled() }}
        run: |
          DEVICE=${{ steps.sim.outputs.udid }}
          DATA=$(xcrun simctl get_app_container "$DEVICE" com.useshrink.app data) || true
          cp "$DATA"/Documents/e2e-photos-*.json e2e-photos/ 2>/dev/null || true
          xcrun simctl spawn "$DEVICE" log show --last 15m --predicate 'process == "Shrink"' --style compact > e2e-photos/app-log.txt || true
          node scripts/check-cleanup-e2e.mjs e2e-photos

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cleanup-e2e
          path: e2e-photos/

  testflight:
    if: ${{ startsWith(github.ref, 'refs/tags/ios-') || (github.event_name == 'workflow_dispatch' && inputs.testflight) }}
    # Only uploads a build whose tests and Free up space run just passed.
    needs: [test, freeup-on-photos]
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      IOS_DIST_KEY: ${{ secrets.IOS_DIST_KEY }}
      # Report a problem's inbox (support/report-inbox.gs). Without it the app would ship with no way to report.
      SHRINK_REPORT_URL: ${{ secrets.SHRINK_REPORT_URL }}
    steps:
      - run: |
          echo "SIGNING_DIR=$RUNNER_TEMP/signing" >> "$GITHUB_ENV"
          echo "KEYCHAIN=$RUNNER_TEMP/build.keychain-db" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          cd ios && xcodegen generate

      - name: Get the signing certificate and App Store profile
        id: signing
        run: node scripts/ios-signing.mjs create "$SIGNING_DIR"

      - name: Put them where Xcode looks
        run: |
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SIGNING_DIR/dist.p12" -P "$(cat "$SIGNING_DIR/p12-password")" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"
          # The app's profile and the share sheet's.
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"
            cp "$SIGNING_DIR/${{ steps.signing.outputs.app_profile_file }}" "$d/${{ steps.signing.outputs.app_profile_uuid }}.mobileprovision"
            cp "$SIGNING_DIR/${{ steps.signing.outputs.share_profile_file }}" "$d/${{ steps.signing.outputs.share_profile_uuid }}.mobileprovision"
          done

      - name: Archive
        run: |
          # Build numbers only have to go up: the UTC minute does that without any bookkeeping.
          case "$SHRINK_REPORT_URL" in
            https://script.google.com/*) ;;
            *) echo "::error::SHRINK_REPORT_URL is missing. Set up support/report-inbox.gs and add its URL as a secret."; exit 1 ;;
          esac
          BUILD_NUMBER=$(date -u +%y%m%d%H%M)
          echo "Build $BUILD_NUMBER"
          xcodebuild -project ios/Shrink.xcodeproj -scheme Shrink -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Shrink.xcarchive" \
            SHRINK_PROVISIONING_PROFILE="${{ steps.signing.outputs.app_profile_name }}" \
            SHRINK_SHARE_PROVISIONING_PROFILE="${{ steps.signing.outputs.share_profile_name }}" \
            SHRINK_REPORT_URL="$SHRINK_REPORT_URL" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" -quiet archive

      - name: Export the .ipa
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>8L2P8U42YK</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.useshrink.app</key><string>${{ steps.signing.outputs.app_profile_name }}</string>
              <key>com.useshrink.app.share</key><string>${{ steps.signing.outputs.share_profile_name }}</string>
            </dict>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Shrink.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export"
          ls -la "$RUNNER_TEMP/export"

      - name: Upload to TestFlight
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s\n' "$ASC_KEY_P8" > ~/.appstoreconnect/private_keys/AuthKey_$ASC_KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP/export/Shrink.ipa" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      - name: Remove the signing files from this Mac
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -rf "$SIGNING_DIR" ~/.appstoreconnect/private_keys
