# XcodeGen spec. CI runs `xcodegen generate` here; never hand-edit the .xcodeproj (it isn't committed).
name: Shrink
options:
  bundleIdPrefix: com.useshrink
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8L2P8U42YK
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Manual
  configs:
    Release:
      CODE_SIGN_IDENTITY: Apple Distribution

targets:
  # The engine: video and photo shrinking, presets. Shared by the app and (later) the Share Extension.
  ShrinkCore:
    type: framework
    platform: iOS
    sources:
      - path: ShrinkCore
      - path: ../shared/presets.json
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.useshrink.app.core
        GENERATE_INFOPLIST_FILE: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  Shrink:
    type: application
    platform: iOS
    # ShrinkUI: the screens the app shares with the share sheet extension.
    sources: [Shrink, ShrinkUI]
    dependencies:
      - target: ShrinkCore
      - target: ShrinkShare
    # Shares Settings (the location switch) with the share sheet. scripts/ios-signing.mjs puts the
    # group in both App Store profiles.
    entitlements:
      path: Shrink/Shrink.entitlements
      properties:
        com.apple.security.application-groups: [group.com.useshrink.app]
    info:
      path: Shrink/Info.plist
      properties:
        CFBundleDisplayName: Shrink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Report a problem's inbox (support/report-inbox.gs); empty except in release builds.
        ShrinkReportURL: $(SHRINK_REPORT_URL)
        # Free up space reads the library and saves the smaller copies. Sending uses the Photos
        # picker, which needs no permission.
        NSPhotoLibraryUsageDescription: Shrink finds your biggest videos so you can shrink them. Nothing leaves your iPhone.
        PHPhotoLibraryPreventAutomaticLimitedAccessAlert: true
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.useshrink.app
        PRODUCT_NAME: Shrink
        TARGETED_DEVICE_FAMILY: "1"
        # Shrink/Assets.xcassets; the icon is drawn by scripts/make-app-icon.py.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(SHRINK_PROVISIONING_PROFILE)

  # "Shrink" in the share sheet (Photos, WhatsApp, Files…): the same job without opening the app.
  # Its own App ID and App Store profile (com.useshrink.app.share) come from scripts/ios-signing.mjs.
  ShrinkShare:
    type: app-extension
    platform: iOS
    sources: [ShrinkShare, ShrinkUI]
    dependencies:
      - target: ShrinkCore
    entitlements:
      path: ShrinkShare/ShrinkShare.entitlements
      properties:
        com.apple.security.application-groups: [group.com.useshrink.app]
    info:
      path: ShrinkShare/Info.plist
      properties:
        CFBundleDisplayName: Shrink
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ShrinkReportURL: $(SHRINK_REPORT_URL)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # One video or one photo at a time.
            NSExtensionActivationRule:
              NSExtensionActivationSupportsMovieWithMaxCount: 1
              NSExtensionActivationSupportsImageWithMaxCount: 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.useshrink.app.share
        PRODUCT_NAME: ShrinkShare
        TARGETED_DEVICE_FAMILY: "1"
        APPLICATION_EXTENSION_API_ONLY: YES
      configs:
        Release:
          PROVISIONING_PROFILE_SPECIFIER: $(SHRINK_SHARE_PROVISIONING_PROFILE)

  # Encoding checks on the simulator: size under target, plays, sound kept, rotation, duration.
  ShrinkTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ShrinkTests]
    dependencies:
      - target: ShrinkCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.useshrink.app.tests

  # Drives the app like a person for the demo recording (.github/workflows/ios-demo.yml). Not run on every push.
  ShrinkUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ShrinkUITests]
    dependencies:
      - target: Shrink
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.useshrink.app.uitests

schemes:
  Shrink:
    build:
      targets:
        Shrink: all
    test:
      config: Debug
      targets: [ShrinkTests]
  ShrinkDemo:
    build:
      targets:
        Shrink: all
        ShrinkUITests: [test]
    test:
      config: Debug
      targets: [ShrinkUITests]
